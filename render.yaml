services:
  - type: web
    name: aix-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000 # Default fallback
      - key: PYTHON_VERSION
        value: 3.11.0 # Or any version you prefer to lock it to
